<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Navi · Workshop agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;           /* slate-900 */
            --panel: #1e293b;        /* slate-800 */
            --panel-2: #334155;      /* slate-700 */
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #6366f1;       /* indigo-500 */
            --accent-soft: #3730a3;
            --success: #10b981;
            --tool: #a78bfa;         /* violet-400 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ===== header ===== */
        header {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        header .brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        header .brand .dot { color: var(--accent); }
        header .meta {
            display: flex;
            gap: 14px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Menlo', monospace;
        }
        header .meta .pill {
            padding: 4px 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        /* ===== conversation ===== */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 32px 28px 140px;
        }
        .convo {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .empty {
            text-align: center;
            color: var(--text-muted);
            padding: 80px 20px;
            font-size: 15px;
        }
        .empty .examples {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
        }
        .empty button {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s, background 0.15s;
        }
        .empty button:hover {
            border-color: var(--accent);
            background: var(--panel-2);
        }

        .turn { display: flex; flex-direction: column; gap: 14px; }
        .msg-user {
            align-self: flex-end;
            max-width: 80%;
            background: var(--accent-soft);
            color: var(--text);
            padding: 12px 18px;
            border-radius: 16px 16px 4px 16px;
            font-size: 15px;
            line-height: 1.5;
        }
        .msg-agent {
            font-size: 15px;
            line-height: 1.65;
            color: var(--text);
            padding: 4px 2px;
        }
        .msg-agent .label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* ===== tool call cards ===== */
        .tool-stack { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
        .tool-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .tool-head {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            font-size: 13px;
        }
        .tool-head:hover { background: var(--panel-2); }
        .tool-head .chev {
            color: var(--text-muted);
            transition: transform 0.15s;
            font-size: 10px;
        }
        .tool-card.open .chev { transform: rotate(90deg); }
        .tool-head .name {
            color: var(--tool);
            font-weight: 600;
            font-family: 'Menlo', monospace;
        }
        .tool-head .summary {
            color: var(--text-muted);
            font-family: 'Menlo', monospace;
            font-size: 12px;
            margin-left: auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 40%;
        }
        .tool-body {
            display: none;
            border-top: 1px solid var(--border);
            padding: 12px 14px;
            font-family: 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.55;
            color: var(--text-muted);
        }
        .tool-card.open .tool-body { display: block; }
        .tool-body .kv { margin-bottom: 10px; }
        .tool-body .kv:last-child { margin-bottom: 0; }
        .tool-body .k {
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 10px;
            margin-bottom: 4px;
        }
        .tool-body pre {
            background: var(--bg);
            padding: 8px 10px;
            border-radius: 6px;
            color: var(--text);
            font-size: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* ===== composer ===== */
        .composer-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 28px 24px;
            background: linear-gradient(180deg, transparent, var(--bg) 30%);
        }
        .composer {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
        }
        .composer:focus-within { border-color: var(--accent); }
        .composer textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            min-height: 24px;
            max-height: 160px;
            outline: none;
            padding: 6px 4px;
        }
        .composer textarea::placeholder { color: var(--text-muted); }
        .composer button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }
        .composer button:hover:not(:disabled) { background: #4f46e5; }
        .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== loading indicator ===== */
        .thinking {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            color: var(--text-muted);
            font-size: 13px;
            font-family: 'Menlo', monospace;
        }
        .thinking .dots::after {
            content: '...';
            animation: dots 1.2s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20%   { content: ''; }
            40%       { content: '.'; }
            60%       { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* ===== error ===== */
        .error {
            background: #7f1d1d;
            border: 1px solid #b91c1c;
            color: #fecaca;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">Mini-Navi<span class="dot">.</span></div>
    <div class="meta">
        <span class="pill" id="model-pill">—</span>
        <span class="pill" id="logfire-pill">logfire: —</span>
    </div>
</header>

<main>
    <div class="convo" id="convo">
        <div class="empty" id="empty">
            <p>Ask the agent anything. Try one of these:</p>
            <div class="examples">
                <button onclick="send('What parks are in Oslo?')">What parks are in Oslo?</button>
                <button onclick="send('How many people live in Bergen?')">How many people live in Bergen?</button>
                <button onclick="send('What\'s the weather in Oslo?')">What's the weather in Oslo?</button>
                <button onclick="send('Find parks in Oslo and tell me the weather there.')">Find parks in Oslo and tell me the weather there.</button>
            </div>
        </div>
    </div>
</main>

<div class="composer-wrap">
    <form class="composer" id="composer">
        <textarea id="prompt" rows="1" placeholder="Ask the agent..." autocomplete="off"></textarea>
        <button id="send-btn" type="submit">Send</button>
    </form>
</div>

<script>
    const convoEl = document.getElementById('convo');
    const emptyEl = document.getElementById('empty');
    const promptEl = document.getElementById('prompt');
    const sendBtn = document.getElementById('send-btn');
    const composerEl = document.getElementById('composer');

    // Load config
    fetch('/api/config').then(r => r.json()).then(cfg => {
        document.getElementById('model-pill').textContent = cfg.model;
        document.getElementById('logfire-pill').textContent =
            cfg.logfire_enabled ? 'logfire: on' : 'logfire: off';
    }).catch(() => {});

    // Auto-grow textarea
    promptEl.addEventListener('input', () => {
        promptEl.style.height = 'auto';
        promptEl.style.height = Math.min(promptEl.scrollHeight, 160) + 'px';
    });

    // Enter = send, Shift+Enter = newline
    promptEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            composerEl.requestSubmit();
        }
    });

    composerEl.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = promptEl.value.trim();
        if (!text) return;
        send(text);
        promptEl.value = '';
        promptEl.style.height = 'auto';
    });

    function addTurn(prompt) {
        if (emptyEl) emptyEl.remove();

        const turn = document.createElement('div');
        turn.className = 'turn';

        const userMsg = document.createElement('div');
        userMsg.className = 'msg-user';
        userMsg.textContent = prompt;
        turn.appendChild(userMsg);

        const thinking = document.createElement('div');
        thinking.className = 'thinking';
        thinking.innerHTML = 'thinking<span class="dots"></span>';
        turn.appendChild(thinking);

        convoEl.appendChild(turn);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        return turn;
    }

    function renderToolCall(call) {
        const card = document.createElement('div');
        card.className = 'tool-card';
        const args = typeof call.args === 'string' ? call.args : JSON.stringify(call.args);
        const result = call.result === null || call.result === undefined
            ? ''
            : (typeof call.result === 'string' ? call.result : JSON.stringify(call.result, null, 2));
        const summary = args.length > 60 ? args.slice(0, 60) + '…' : args;
        card.innerHTML = `
            <div class="tool-head">
                <span class="chev">▶</span>
                <span class="name">${call.name}</span>
                <span class="summary">${escapeHtml(summary)}</span>
            </div>
            <div class="tool-body">
                <div class="kv"><div class="k">arguments</div><pre>${escapeHtml(args)}</pre></div>
                <div class="kv"><div class="k">result</div><pre>${escapeHtml(result)}</pre></div>
            </div>`;
        card.querySelector('.tool-head').addEventListener('click', () => {
            card.classList.toggle('open');
        });
        return card;
    }

    function renderAgentResponse(turn, data) {
        turn.querySelector('.thinking')?.remove();

        if (data.tool_calls && data.tool_calls.length) {
            const stack = document.createElement('div');
            stack.className = 'tool-stack';
            for (const call of data.tool_calls) stack.appendChild(renderToolCall(call));
            turn.appendChild(stack);
        }

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = `Mini-Navi · ${data.model}`;
        turn.appendChild(label);

        const msg = document.createElement('div');
        msg.className = 'msg-agent';
        msg.textContent = data.output;
        turn.appendChild(msg);

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function renderError(turn, detail) {
        turn.querySelector('.thinking')?.remove();
        const err = document.createElement('div');
        err.className = 'error';
        err.textContent = detail || 'Something went wrong.';
        turn.appendChild(err);
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    async function send(text) {
        sendBtn.disabled = true;
        const turn = addTurn(text);
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text }),
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
                renderError(turn, err.detail);
                return;
            }
            const data = await res.json();
            renderAgentResponse(turn, data);
        } catch (e) {
            renderError(turn, e.message);
        } finally {
            sendBtn.disabled = false;
            promptEl.focus();
        }
    }

    // Global so onclick="send('...')" works on the suggestion buttons
    window.send = send;
</script>
</body>
</html>
